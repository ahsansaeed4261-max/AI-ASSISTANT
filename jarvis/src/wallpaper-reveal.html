<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <meta name="color-scheme" content="dark" />
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #reveal{position:absolute;inset:0;overflow:hidden;clip-path:circle(0 at 50% 0);background:#101114}
    #wallpaper{width:100%;height:100%;object-fit:cover}
    #shade{position:absolute;inset:0;background:linear-gradient(180deg,#0001,#0003)}
  </style>
</head>
<body>
  <div id="reveal"><img id="wallpaper" alt="" /><div id="shade"></div></div>
  <script>
    window.wallpaperReveal.onStart(({ image, originX, originY, duration }) => {
      const reveal = document.getElementById('reveal');
      const imageElement = document.getElementById('wallpaper');
      imageElement.src = image;
      const radius = Math.ceil(Math.hypot(window.innerWidth, window.innerHeight));
      reveal.animate(
        [
          { clipPath: `circle(0px at ${originX}px ${originY}px)` },
          { clipPath: `circle(${radius}px at ${originX}px ${originY}px)` },
        ],
        { duration, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' },
      );
      reveal.animate(
        [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.025)' }],
        { duration: 220, delay: Math.max(0, duration - 180), easing: 'ease-out', fill: 'forwards' },
      );
    });
  </script>
</body>
</html>
