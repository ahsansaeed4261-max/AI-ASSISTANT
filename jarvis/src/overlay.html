<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 8px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease;
      opacity: 0;
      user-select: none;
      pointer-events: none;
    }

    .pill.visible {
      opacity: 1;
    }

    .pill.fade-out {
      opacity: 0;
    }

    /* Pulsing red dot for recording */
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      flex-shrink: 0;
    }

    .pill.recording .dot {
      animation: pulse-red 1.2s ease-in-out infinite;
    }

    .pill.thinking .dot {
      background: #4a9eff;
      animation: pulse-blue 1s ease-in-out infinite;
    }

    @keyframes pulse-red {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
      50% { transform: scale(1.3); opacity: 0.9; box-shadow: 0 0 0 6px rgba(255, 68, 68, 0); }
    }

    @keyframes pulse-blue {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.7); }
      50% { transform: scale(1.2); opacity: 0.9; box-shadow: 0 0 0 5px rgba(74, 158, 255, 0); }
    }

    .label {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="dot"></div>
    <span class="label" id="label">Listening...</span>
  </div>

  <script>
    const pill = document.getElementById('pill');
    const label = document.getElementById('label');

    window.overlayAPI.onUpdateState(({ state }) => {
      if (state === 'recording') {
        pill.className = 'pill recording visible';
        label.textContent = 'Listening...';
      } else if (state === 'thinking') {
        pill.className = 'pill thinking visible';
        label.textContent = 'Thinking...';
      } else if (state === 'hide') {
        pill.classList.add('fade-out');
        pill.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
